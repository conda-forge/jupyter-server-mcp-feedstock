context:
  version: "0.4.1"

package:
  name: jupyter-server-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-server-mcp/jupyter_server_mcp-${{ version }}.tar.gz
  sha256: 0f8a5a6a28fcdf55d8c3691b412e794af42c139f28855c6a279708d30caa4e6f

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.5
  run:
    - python >=${{ python_min }}
    - fastmcp >=3.4.4,<5
    - jupyter_server >=1.6,<3

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - jupyter_server_mcp
      pip_check: true

about:
  homepage: https://github.com/jupyter-ai-contrib/jupyter-server-mcp
  summary: "An MCP interface/extension for Jupyter Server"
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://jupyter-ai.readthedocs.io/
  repository: https://github.com/jupyter-ai-contrib/jupyter-server-mcp

extra:
  recipe-maintainers:
    - jtpio
    - dlqqq
    - andrii-i
    - conda-forge/jupyter-ai
